<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYNE — Dashboard</title>
<style>
  :root {
    --bg: #0a0a0d;
    --panel: #121217;
    --panel-border: #212128;
    --text: #f2f2f5;
    --text-dim: #8d8d99;
    --accent-purple: #8b7cf6;
    --accent-green: #4ade80;
    --accent-red: #f87171;
    --accent-blue: #60a5fa;
    --accent-yellow: #facc15;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(139, 124, 246, 0.14), transparent 60%),
      radial-gradient(700px 450px at 100% 20%, rgba(96, 165, 250, 0.10), transparent 55%),
      radial-gradient(800px 600px at 50% 120%, rgba(74, 222, 128, 0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 48px 32px 80px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* Header row */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .page-header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .get-script-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-purple);
    color: #0a0a0d;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: opacity .15s ease;
  }
  .get-script-btn:hover { opacity: .85; }

  /* Top 3 stat cards */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 320px));
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 700px) { .stat-grid { grid-template-columns: minmax(0, 320px); } }

  .stat-icon.discord { background: rgba(139,124,246,.15); color: var(--accent-purple); }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 24px 26px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .stat-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    font-size: 16px;
  }
  .stat-icon.purple { background: rgba(139,124,246,.15); color: var(--accent-purple); }
  .stat-icon.green  { background: rgba(74,222,128,.15); color: var(--accent-green); }
  .stat-icon.blue   { background: rgba(96,165,250,.15); color: var(--accent-blue); }

  .stat-value { font-size: 30px; font-weight: 700; margin-bottom: 4px; }
  .stat-note { font-size: 13px; color: var(--text-dim); }

  /* Supported games row */
  .games-section {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }
  @media (max-width: 800px) { .games-section { grid-template-columns: 1fr; } }

  .games-intro {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 28px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .games-intro .eyebrow { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .games-intro h2 { font-size: 24px; font-weight: 700; line-height: 1.25; margin-bottom: 14px; }
  .games-intro p { font-size: 14px; color: var(--text-dim); line-height: 1.5; margin-bottom: 18px; }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    background: #1a1a21;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
  }

  .games-list { display: flex; flex-direction: column; gap: 16px; }
  .game-row {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .game-icon {
    width: 34px; height: 34px;
    border-radius: 9px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    overflow: hidden;
  }
  .game-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .game-row h3 {
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .game-row p { font-size: 13px; color: var(--text-dim); line-height: 1.4; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .badge.trending { background: rgba(74,222,128,.15); color: var(--accent-green); }
  .badge.supported { background: rgba(96,165,250,.15); color: var(--accent-blue); }

</style>
</head>
<body>
<div class="wrap">

  <div class="page-header">
    <h1>Home</h1>
    <a href="#" class="get-script-btn">Get Script</a>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon blue">◉</div>
      <div class="stat-label">TOTAL USERS</div>
      <div class="stat-value">0</div>
      <div class="stat-note">Registered users</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon discord">◈</div>
      <div class="stat-label">DISCORD</div>
      <div class="stat-value" id="discord-count">0</div>
      <div class="stat-note">Server members</div>
    </div>
  </div>

  <div class="games-section">
    <div class="games-intro">
      <div>
        <div class="eyebrow">SUPPORTED GAMES</div>
        <h2>Ready for the most profitable games.</h2>
        <p>Configure scripts and filters for the supported Roblox games.</p>
      </div>
      <div class="pill-row">
        <span class="pill">1 active game</span>
        <span class="pill">Filters ready</span>
      </div>
    </div>

    <div class="games-list">
      <div class="game-row">
        <div class="game-icon" style="background:rgba(74,222,128,.15);">
          <img id="rt2-icon" data-place-id="3398014311" alt="Restaurant Tycoon 2 thumbnail">
        </div>
        <div>
          <h3>Restaurant Tycoon 2 <span class="badge supported">Supported</span></h3>
          <p>Auto bill, fast workers, auto cooks.</p>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="roblox-api.js"></script>
<script>
  // Reads the server ID from server-id.txt, sitting in the same folder as this file
  fetch("server-id.txt")
    .then(res => res.text())
    .then(id => {
      const serverId = id.trim();
      return fetch(`https://discord.com/api/guilds/${serverId}/widget.json`);
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById("discord-count").textContent = data.presence_count.toLocaleString();
    })
    .catch(err => {
      console.error("Couldn't load Discord widget data:", err);
      // leave the fallback "0" in place if the fetch fails
    });

  // Pull the game's real icon from Roblox using the roblox-api.js module
  const icon = document.getElementById("rt2-icon");
  const placeId = icon.dataset.placeId;

  RobloxAPI.getUniverseId(placeId)
    .then(universeId => RobloxAPI.getGameIcon(universeId))
    .then(iconUrl => {
      if (iconUrl) icon.src = iconUrl;
    })
    .catch(err => {
      console.error("Couldn't load Roblox game thumbnail:", err);
    });
</script>
</body>
</html>
